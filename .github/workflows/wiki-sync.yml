name: Sync wiki

# docs/wiki/ in the main repo is the reviewable source of truth (edited via PRs).
# On merge to main it is mirrored to the GitHub Wiki.
#
# Prerequisite (one-time, manual): enable Wiki in repo Settings and create any first
# page via the UI so the <repo>.wiki.git remote exists.
# If GITHUB_TOKEN cannot push to the wiki repo (403), add a classic PAT with `repo`
# scope as the WIKI_TOKEN secret — the job prefers it automatically.

on:
  push:
    branches: [main]
    paths: ["docs/wiki/**"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror docs/wiki → GitHub Wiki
        env:
          TOKEN: ${{ secrets.WIKI_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.wiki.git" /tmp/wiki
          rsync -a --delete --exclude .git docs/wiki/ /tmp/wiki/
          cd /tmp/wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "wiki: sync from ${GITHUB_SHA::7}"; git push; }
